title: "Googleyness, Leadership and Culture: Competency Questions"
title_zh: "Googleyness、领导力与文化：胜任力问题"
summary: >-
  A 45-minute, final-stage competency interview run by a people-and-culture partner or another interviewer
  trained on the "Googleyness and leadership" rubric, covering motivation and mission, collaboration and
  conflict, ownership under ambiguity, leadership and teams, failure and feedback, and responsibility. Most
  questions are answered as one real story in Situation, Task, Action, Result (STAR) form, naming your own
  specific actions, the evidence of their impact, and what you learned; a few ask instead for a stated
  position backed by one concrete example.
summary_zh: "一场 45 分钟的终面阶段胜任力面试，由人力与文化伙伴（people-and-culture partner）或另一位接受过“Googleyness and leadership”评分标准培训的面试官主持，涵盖动机与使命、协作与冲突、模糊环境下的主人翁意识（ownership）、领导力与团队、失败与反馈，以及责任感。大多数问题都要用情境、任务、行动、结果（STAR）的结构讲述一个真实的故事，说清楚你自己具体的行动、影响的证据，以及你学到了什么；也有少数问题要求给出一个有具体例子支撑的立场。"
category: behavioral
kind: Behavioral
kind_zh: 行为面
roles: [All]
topics: [star, why-gdm, collaboration, conflict, ownership, ambiguity, leadership, failure, responsibility]
