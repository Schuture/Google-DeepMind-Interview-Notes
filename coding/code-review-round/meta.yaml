title: "Code Review: Ranking the Defects in a Checkpointing Change"
title_zh: "代码评审：给一次 checkpoint 改动中的缺陷排序"
summary: >-
  Review a pull request that adds checkpointing and sharded sampling to a training loop, rank its
  defects by blast radius, then fix and test the ones that can silently lose or corrupt a run.
