title: "LLM Fundamentals: Attention, Transformers and the Training Pipeline"
title_zh: "大模型基础：注意力、Transformer 与训练流程"
summary: "Twelve rapid derivations spanning attention and the LLM training pipeline: the 1/sqrt(d) scaling and attention's compute and memory cost, the KV cache and RoPE, parameter and FLOP counts, pre- versus post-norm, cross-entropy and perplexity, byte-pair encoding, compute-optimal scaling, post-training objectives, sampling, and mixture-of-experts routing, each traced through a worked number."
